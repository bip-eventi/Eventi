<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enterprise · Il tuo evento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --choc:#3b0d01; --choc2:#5a2a18; --blu:#1f5fa8; --blu2:#2f80d8;
    --crema:#fff6e6; --oro:#f4c04e; --rosso:#e53b3b; --ink:#241008;
    --display:"Orbitron","Eurostile","Trebuchet MS",system-ui,sans-serif;
    --testo:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{background:var(--blu)}
  body{margin:0;min-height:100vh;font-family:var(--testo);color:var(--ink);position:relative;overflow-x:hidden}

  /* spirale blu */
  body::before{
    content:"";position:fixed;inset:-50vmax;z-index:-2;
    background:repeating-conic-gradient(from 0deg at 62% 70%, var(--blu) 0 9deg, var(--blu2) 9deg 18deg);
    animation:gira 140s linear infinite;
  }
  /* trama a puntini (stile fumetto) */
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(rgba(10,30,70,.28) 1.2px, transparent 1.6px) 0 0/7px 7px;
  }
  @keyframes gira{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){body::before{animation:none}}

  /* testata cioccolato */
  .top{position:relative;text-align:center}
  .marrone{background:var(--choc);padding:0 0 6px;position:relative}
  .marrone .titolo,.marrone .edizione{padding:0 20px}
  .top .nave{width:min(100%,460px);height:auto;display:block;margin:0 auto;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 6%,#000 90%,transparent 100%);-webkit-mask-composite:source-in;
    mask-image:linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 6%,#000 90%,transparent 100%);mask-composite:intersect}
  .titolo{font-family:var(--display);font-weight:800;color:#fff;margin:6px 0 0;
    font-size:clamp(38px,11vw,58px);letter-spacing:.5px;line-height:1}
  .edizione{font-family:var(--display);font-weight:600;color:var(--oro);
    font-size:clamp(13px,3.6vw,17px);letter-spacing:2px;text-transform:uppercase;margin:6px 0 0}
  .colata{display:block;width:100%;height:70px;margin-top:-1px}
  .scia{position:absolute;color:#fff}
  .scia svg{width:100%;height:100%;display:block}

  .sotto{max-width:520px;margin:-4px auto 0;padding:0 18px 36px}
  .sub{margin:14px 0 14px;text-align:center;color:#fff;font-weight:700;font-size:17px;
    text-shadow:0 2px 0 rgba(10,20,50,.55)}

  /* schede */
  .sede{width:100%;text-align:left;border:3px solid var(--ink);border-radius:18px;background:var(--crema);
    padding:14px 16px;margin-bottom:14px;box-shadow:5px 5px 0 var(--ink);cursor:pointer;font:inherit;color:inherit;
    display:flex;justify-content:space-between;align-items:center;gap:12px;transition:transform .12s, box-shadow .12s}
  .sede:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
  .sede b{font-family:var(--display);font-size:20px;display:block}
  .sede span{display:block;margin-top:3px;font-size:14px;color:#6a4a3a}
  .freccia{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;color:var(--choc)}
  .tag{background:var(--choc);color:var(--oro);font-family:var(--display);font-weight:600;font-size:12px;
    padding:7px 11px;border-radius:999px;text-align:center;max-width:46%;line-height:1.25}

  /* dettaglio */
  .back{background:var(--oro);border:3px solid var(--ink);border-radius:999px;padding:8px 16px;margin-bottom:14px;
    font:700 15px var(--testo);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
  .dettaglio{background:var(--crema);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);overflow:hidden}
  .dettaglio h2{margin:0;padding:16px 18px;background:var(--choc);color:#fff;font-family:var(--display);font-size:21px;line-height:1.25}
  .corpo{padding:6px 18px 18px}
  .riga{display:flex;gap:12px;padding:13px 0;border-top:2px dashed rgba(36,16,8,.18)}
  .riga:first-child{border-top:0}
  .ico{font-size:22px;width:28px;text-align:center}
  .riga small{display:block;color:#8a6a58;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .riga div{font-size:17px}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .btn{flex:1;min-width:150px;text-align:center;padding:13px;border-radius:14px;background:var(--oro);color:var(--ink);
    text-decoration:none;font:700 16px var(--testo);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer}
  .btn.sec{background:#fff}
  .btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
  .note{margin:16px 0 0;padding:12px 14px;background:#fff;border:2px solid var(--ink);border-radius:12px;font-size:15px}

  footer{max-width:520px;margin:0 auto;padding:0 22px 26px;text-align:right}
  .bip{width:78px;height:auto;display:inline-block;filter:drop-shadow(0 2px 0 rgba(10,20,50,.55))}
</style>
</head>

<script>
/* ===== DA MODIFICARE: un elemento per sede =====
   data: AAAA-MM-GG   inizio/fine: HH:MM (lascia "" se non è ancora noto) */
const EVENTI = [
  {id:"roma",    sede:"Roma",    tipo:"Festa",     data:"2027-01-13", inizio:"20:00", fine:"", luogo:"Party Foundation presso Eden Experience", indirizzo:"Piazzale dello Stadio Olimpico, 5 – Roma", note:"", viaggio:""},
  {id:"napoli",  sede:"Napoli",  tipo:"Pranzo",    data:"2027-01-14", inizio:"11:30", fine:"", luogo:"In ufficio", indirizzo:"", note:"", viaggio:""},
  {id:"bari",    sede:"Bari",    tipo:"Pranzo",    data:"2027-01-21", inizio:"11:30", fine:"", luogo:"In ufficio", indirizzo:"", note:"",
   viaggio:"Volo per Milano alle 22:25 (unico diretto). L'aeroporto dista 20 minuti dalla sede."},
  {id:"palermo", sede:"Palermo", tipo:"Pranzo",    data:"2027-01-22", inizio:"11:30", fine:"", luogo:"In ufficio", indirizzo:"", note:"",
   viaggio:"Ultimo volo per Milano alle 22:40. L'aeroporto dista 40 minuti dalla sede."},
  {id:"bologna", sede:"Bologna", tipo:"Aperitivo", data:"2027-01-26", inizio:"19:00", fine:"", luogo:"In ufficio", indirizzo:"", note:"", viaggio:""},
  {id:"milano",  sede:"Milano",  tipo:"Festa",     data:"2027-01-27", inizio:"20:00", fine:"", luogo:"Party Foundation presso 55 Milano", indirizzo:"Via Piero della Francesca, 55 – Milano", note:"", viaggio:""}
];

const $ = s => document.querySelector(s);
const app = $("#app");
const fmtData = d => new Date(d+"T12:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);

function lista(){
  $("#sub").textContent = "Seleziona la tua sede di appartenenza per scoprire il tuo evento.";
  app.innerHTML = EVENTI.map(e=>`
    <button class="sede" onclick="apri('${e.id}')">
      <div><b>${e.sede}</b><span>${cap(fmtData(e.data))}</span></div>
      <div class="freccia">›</div>
    </button>`).join("");
  try{history.replaceState(null,"",location.pathname)}catch(_){}
}

function apri(id){
  const e = EVENTI.find(x=>x.id===id); if(!e) return lista();
  $("#sub").textContent = "Sede di " + e.sede;
  const mappa = "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(e.mappa||[e.luogo,e.indirizzo].filter(Boolean).join(", "));
  app.innerHTML = `
    <button class="back" onclick="lista()">‹ Cambia sede</button>
    <div class="dettaglio">
      <h2>${e.tipo}</h2>
      <div class="corpo">
        <div class="riga"><div class="ico">📅</div><div><small>Data</small>${cap(fmtData(e.data))}</div></div>
        <div class="riga"><div class="ico">🕒</div><div><small>Orario</small>${e.inizio?e.inizio+(e.fine?" – "+e.fine:""):"Da confermare"}</div></div>
        ${(e.luogo||e.indirizzo)?`<div class="riga"><div class="ico">📍</div><div><small>Luogo</small>${[e.luogo,e.indirizzo].filter(Boolean).join("<br>")}</div></div>`:""}
        <div class="btns">
          ${(e.indirizzo||e.mappa)?`<a class="btn" href="${mappa}" target="_blank" rel="noopener">Apri la mappa</a>`:""}
          <button class="btn sec" onclick="ics('${e.id}')">Aggiungi al calendario</button>
        </div>
        ${e.note?`<p class="note">${e.note}</p>`:""}
      </div>
    </div>`;
  try{history.replaceState(null,"","?sede="+id)}catch(_){}
}

function ics(id){
  const e = EVENTI.find(x=>x.id===id);
  const t = (d,h)=>d.replace(/-/g,"")+"T"+h.replace(":","")+"00";
  const txt = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Evento//IT","BEGIN:VEVENT",
    "UID:"+id+"-"+e.data+"@evento","DTSTAMP:"+t(e.data,"00:00"),
    ...(e.inizio?["DTSTART:"+t(e.data,e.inizio),"DTEND:"+t(e.data,e.fine||e.inizio)]:["DTSTART;VALUE=DATE:"+e.data.replace(/-/g,"")]),
    "SUMMARY:"+e.tipo+" - "+e.sede,"LOCATION:"+[e.luogo,e.indirizzo].filter(Boolean).join(", "),
    "DESCRIPTION:"+(e.note||""),"END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([txt],{type:"text/calendar"}));
  a.download="evento-"+id+".ics"; a.click();
}

const q = new URLSearchParams(location.search).get("sede");
q ? apri(q) : lista();
</script>
